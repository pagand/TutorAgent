worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    # Stage 5: the API now sits behind CloudFront too (D1), so every
    # request nginx sees arrives from a CloudFront edge IP, not the real
    # client. cloudfront-origin-ips.conf tells nginx to trust only those
    # edge IPs and recover the true client from X-Forwarded-For, which
    # CloudFront always sets. Without this, $binary_remote_addr below is
    # constant across all traffic and every limit_req_zone is keyed on one
    # shared address instead of the real client (V4 in the Stage 5 plan).
    include /etc/nginx/cloudfront-origin-ips.conf;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # Rate limiting, split into three zones. All are keyed per source IP -
    # correct now that real_ip_recursive above resolves $binary_remote_addr
    # to the true client rather than the CloudFront edge. A whole exam hall
    # can still share one NAT egress IP upstream of that. As of Stage 4.5, the
    # app itself enforces the real cost ceiling per-user/globally
    # (app/services/llm_quota.py, which nginx can't do because it can't see
    # user_id) - these zones exist to bound request *volume*, not spend, so
    # they're sized for a synchronised 50-student hall rather than for cost.
    #
    # `api` covers session/timer/logging/answer/questions traffic. Raised
    # from 50r/s burst=200: a synchronised start (50 students x ~3 init
    # calls) plus the steady 25s heartbeat, 15s intervention poll and
    # action-log stream was thin headroom for one shared hall IP.
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
    # `llm` covers the expensive /hints/ and /chat/ routes. Raised from
    # 5r/s burst=20: at the old rate a hall where several students hit "Get
    # Hint" within the same couple of seconds got 503'd by nginx to protect
    # a budget the app now protects properly - nginx failing real students
    # to defend a cost ceiling it's no longer the last line of defense for.
    limit_req_zone $binary_remote_addr zone=llm:10m rate=20r/s;
    # `login` covers POST /participants/login specifically - it discloses a
    # valid token's real name with no other rate limit of its own
    # (PRELAUNCH_CHECKLIST.md section 0), so it gets a much tighter zone to
    # blunt enumeration/probing while still allowing a normal student a
    # handful of legitimate retries.
    limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;

    # Gzip for JSON API responses
    gzip            on;
    gzip_types      application/json text/plain;
    gzip_min_length 1000;

    client_max_body_size 2m;

    # Raised timeouts for LLM inference (can take 30-60s)
    proxy_read_timeout   120s;
    proxy_connect_timeout 10s;
    proxy_send_timeout   120s;

    # Docker's embedded DNS. nginx resolves a plain `upstream` block's
    # hostname exactly once, at config load, and caches that IP for the life
    # of the process. On 2026-08-05 that took the whole API down: the api
    # container came back on a new bridge IP, 172.18.0.2 was handed to the
    # streamlit container instead (same image, so it advertises 8000 but
    # nothing listens there), and nginx kept proxying to the stale address -
    # "connect() failed (111: Connection refused)" and a hard 502 on every
    # /api/* request until nginx was manually restarted. Any api restart
    # reproduces it, including the `docker compose up -d api` that
    # PRELAUNCH_CHECKLIST.md documents as the mid-exam way to raise the LLM
    # quota. `valid=10s` re-resolves, so nginx recovers on its own.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Re-resolution only happens when the upstream host is a *variable*;
    # a literal proxy_pass is resolved at config load like the upstream
    # block was. app.conf sets $api_upstream and each location proxies to
    # it. Upstream keepalive is not available on this path, which costs one
    # local TCP handshake per request over the docker bridge - sub-millisecond,
    # and worth it to not have a 502 that only a human can clear.
    map $host $api_upstream {
        default "api:8000";
    }

    # scripts/ec2-bootstrap.sh copies nginx/available/app.conf here on every
    # boot (with the origin secret substituted in) - TLS terminates at
    # CloudFront (D1), so nginx only ever serves plain HTTP.
    include /etc/nginx/conf.d/*.conf;
}
