worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    # Rate limiting, split into two zones. Both are keyed per source IP -
    # there is no ALB/CloudFront in front of nginx for the API (only the
    # frontend goes through CloudFront; the recorded decision explicitly
    # rejects an ALB/NLB), so $binary_remote_addr is the real client IP.
    #
    # `api` covers session/timer/logging/answer/questions traffic. Raised
    # from the original 20r/s burst=50: that bucket is shared by every
    # student behind one exam-hall NAT egress IP, and a synchronised start
    # (50 students x ~3 init calls) blows through it in a couple of seconds.
    limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
    # `llm` covers the expensive /hints/ and /chat/ routes specifically, kept
    # separate and much tighter so a hint/chat storm can't starve the cheap
    # traffic sharing the same zone, and so those routes have an actual cap
    # at all - there was none before.
    limit_req_zone $binary_remote_addr zone=llm:10m rate=5r/s;

    # Gzip for JSON API responses
    gzip            on;
    gzip_types      application/json text/plain;
    gzip_min_length 1000;

    client_max_body_size 2m;

    # Raised timeouts for LLM inference (can take 30-60s)
    proxy_read_timeout   120s;
    proxy_connect_timeout 10s;
    proxy_send_timeout   120s;

    upstream api {
        server api:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Apply the general rate limit to all API calls
        limit_req zone=api burst=200 nodelay;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;

        location / {
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # SSE / streaming support (chat endpoint)
            proxy_buffering    off;
            proxy_cache        off;
        }

        # Expensive LLM routes: the tighter `llm` zone, in addition to (not
        # instead of) the general `api` zone above.
        location ~ ^/(hints|chat)/ {
            limit_req zone=llm burst=20 nodelay;

            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_buffering    off;
            proxy_cache        off;
        }

        # Health check (used by load balancer / monitoring)
        location /health {
            proxy_pass http://api/;
            access_log off;
        }
    }

    # --- SSL placeholder ---
    # Enabled in Phase 3 (Stage 5, once DNS + certbot are in place). To enable HTTPS:
    # 1. Obtain cert for air.da-tu.ca via certbot
    # 2. Uncomment and populate the ssl server block below (top-level of
    #    http{}, a sibling of the :80 server block above - NOT nested inside
    #    it, which is where an earlier draft of this file placed it; nginx
    #    refuses to start with a "server" directive nested inside another).
    # 3. Change listen 80 above to redirect to 443

    # server {
    #     listen 443 ssl;
    #     server_name air.da-tu.ca;
    #     ssl_certificate     /etc/letsencrypt/live/air.da-tu.ca/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/air.da-tu.ca/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
