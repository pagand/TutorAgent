# All three services cap logs at 30MB total (json-file is unbounded by
# default, which can fill the disk over a long exam window).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aitutor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-aitutor_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aitutor} -d ${POSTGRES_DB:-aitutor_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 768m
    logging: *default-logging

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aitutor}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-aitutor_db}
    volumes:
      - chroma_data:/app/chroma_db
      - ./prod/data:/app/prod/data:ro
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    mem_limit: 2g
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3

  # TLS terminates at CloudFront (Stage 5, D1); nginx only ever serves
  # plain HTTP, so no 443 mapping and no certbot mounts.
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      # Admin dashboard. nginx fronts the FastAPI /admin router here, loopback
      # only, so the existing `aws ssm start-session ... portNumber=8501`
      # command is unchanged.
      - "127.0.0.1:8501:8501"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/cloudfront-origin-ips.conf:/etc/nginx/cloudfront-origin-ips.conf:ro
    depends_on:
      - api
    mem_limit: 128m
    logging: *default-logging

volumes:
  postgres_data:
  chroma_data:
