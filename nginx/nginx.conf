worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    # Rate limiting, split into three zones. All are keyed per source IP -
    # there is no ALB/CloudFront in front of nginx for the API (only the
    # frontend goes through CloudFront; the recorded decision explicitly
    # rejects an ALB/NLB), so $binary_remote_addr is the real client IP,
    # AND a whole exam hall shares one NAT egress IP. As of Stage 4.5, the
    # app itself enforces the real cost ceiling per-user/globally
    # (app/services/llm_quota.py, which nginx can't do because it can't see
    # user_id) - these zones exist to bound request *volume*, not spend, so
    # they're sized for a synchronised 50-student hall rather than for cost.
    #
    # `api` covers session/timer/logging/answer/questions traffic. Raised
    # from 50r/s burst=200: a synchronised start (50 students x ~3 init
    # calls) plus the steady 25s heartbeat, 15s intervention poll and
    # action-log stream was thin headroom for one shared hall IP.
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
    # `llm` covers the expensive /hints/ and /chat/ routes. Raised from
    # 5r/s burst=20: at the old rate a hall where several students hit "Get
    # Hint" within the same couple of seconds got 503'd by nginx to protect
    # a budget the app now protects properly - nginx failing real students
    # to defend a cost ceiling it's no longer the last line of defense for.
    limit_req_zone $binary_remote_addr zone=llm:10m rate=20r/s;
    # `login` covers POST /participants/login specifically - it discloses a
    # valid token's real name with no other rate limit of its own
    # (PRELAUNCH_CHECKLIST.md section 0), so it gets a much tighter zone to
    # blunt enumeration/probing while still allowing a normal student a
    # handful of legitimate retries.
    limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;

    # Gzip for JSON API responses
    gzip            on;
    gzip_types      application/json text/plain;
    gzip_min_length 1000;

    client_max_body_size 2m;

    # Raised timeouts for LLM inference (can take 30-60s)
    proxy_read_timeout   120s;
    proxy_connect_timeout 10s;
    proxy_send_timeout   120s;

    upstream api {
        server api:8000;
        keepalive 32;
    }

    # The active server block is chosen at boot by scripts/ec2-bootstrap.sh:
    # nginx/available/plain.conf before a certificate exists, nginx/available/
    # tls.conf once certbot has issued one. Copied into the gitignored
    # nginx/conf.d/app.conf, which this include picks up.
    include /etc/nginx/conf.d/*.conf;
}
