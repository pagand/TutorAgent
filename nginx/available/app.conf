# Stage 5: the only server block. TLS terminates at CloudFront (D1);
# certbot and the plain/tls split it existed for are gone (D2). Copied to
# nginx/conf.d/app.conf by scripts/ec2-bootstrap.sh, which substitutes
# __ORIGIN_SECRET__ with the real value from SSM (/aitutor/prod/origin_secret).
server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Internal debugging convenience only (V8 in the Stage 5 plan) - not
    # gated behind the origin secret, mirroring app/main.py's own exemption
    # of GET / from the API-key check. Not reachable from the internet:
    # the SG (network.tf) admits only CloudFront's origin-facing ranges,
    # so this is reached via SSM session + curl localhost, never directly.
    location /health {
        proxy_pass http://$api_upstream/;
        access_log off;
    }

    # Every /api/* location below rejects requests missing the shared
    # secret CloudFront attaches as a custom origin header (frontend.tf's
    # ec2-api origin) - even though the SG already restricts port 80 to
    # CloudFront's ranges, this stops the origin from being driven directly
    # if the SG is ever loosened (V5). Repeated per-location rather than
    # once at server level so /health above stays exempt: an `if` at server
    # level runs before location matching and can't be scoped out that way.
    location /api/ {
        limit_req zone=api burst=300 nodelay;

        if ($http_x_origin_secret != "__ORIGIN_SECRET__") {
            return 403;
        }

        rewrite ^/api/(.*)$ /$1 break;

        proxy_pass         http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE / streaming support (chat endpoint)
        proxy_buffering    off;
        proxy_cache        off;
    }

    # Expensive LLM routes: the tighter `llm` zone, in addition to (not
    # instead of) the general `api` zone above. No `^~` needed - nginx
    # tests regex locations against every prefix match that lacks one, so
    # this correctly outranks the /api/ prefix location above for
    # /api/hints/* and /api/chat/* regardless of file order.
    location ~ ^/api/(hints|chat)/ {
        limit_req zone=llm burst=50 nodelay;

        if ($http_x_origin_secret != "__ORIGIN_SECRET__") {
            return 403;
        }

        rewrite ^/api/(.*)$ /$1 break;

        proxy_pass         http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_buffering    off;
        proxy_cache        off;
    }

    # Token-name-disclosure oracle (PRELAUNCH_CHECKLIST.md section 0): the
    # tightest zone, in addition to the general `api` zone above.
    location = /api/participants/login {
        limit_req zone=login burst=10 nodelay;

        if ($http_x_origin_secret != "__ORIGIN_SECRET__") {
            return 403;
        }

        rewrite ^/api/(.*)$ /$1 break;

        proxy_pass         http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
