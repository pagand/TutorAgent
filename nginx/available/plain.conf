# Active before a TLS certificate exists. Copied to nginx/conf.d/app.conf
# by scripts/ec2-bootstrap.sh. Port 80 only, no domain restriction so it
# also answers the ACME HTTP-01 challenge before DNS/cert setup is done.
server {
    listen 80;
    server_name _;

    # Webroot path certbot writes its challenge token to.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Apply the general rate limit to all API calls
    limit_req zone=api burst=300 nodelay;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        proxy_pass         http://api;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE / streaming support (chat endpoint)
        proxy_buffering    off;
        proxy_cache        off;
    }

    # Expensive LLM routes: the tighter `llm` zone, in addition to (not
    # instead of) the general `api` zone above.
    location ~ ^/(hints|chat)/ {
        limit_req zone=llm burst=50 nodelay;

        proxy_pass         http://api;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_buffering    off;
        proxy_cache        off;
    }

    # Token-name-disclosure oracle (PRELAUNCH_CHECKLIST.md section 0): the
    # tightest zone, in addition to the general `api` zone above.
    location = /participants/login {
        limit_req zone=login burst=10 nodelay;

        proxy_pass         http://api;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Health check (used by load balancer / monitoring)
    location /health {
        proxy_pass http://api/;
        access_log off;
    }
}
