# All three services cap logs at 30MB total (json-file is unbounded by
# default, which can fill the disk over a long exam window).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aitutor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-aitutor_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aitutor} -d ${POSTGRES_DB:-aitutor_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 768m
    logging: *default-logging

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aitutor}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-aitutor_db}
    volumes:
      - chroma_data:/app/chroma_db
      - ./prod/data:/app/prod/data:ro
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    mem_limit: 2g
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3

  # TLS terminates at CloudFront (Stage 5, D1); nginx only ever serves
  # plain HTTP, so no 443 mapping and no certbot mounts.
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/cloudfront-origin-ips.conf:/etc/nginx/cloudfront-origin-ips.conf:ro
    depends_on:
      - api
    mem_limit: 128m
    logging: *default-logging

  # Admin dashboard. Bound to the host's loopback only (127.0.0.1:8501,
  # not 0.0.0.0) - reached via `ssh -L 8501:localhost:8501`, never exposed
  # to the internet. Same image as `api`, overriding entrypoint.sh's
  # migrate-then-uvicorn default with the Streamlit command instead. Talks
  # to Postgres directly (see streamlit_app/app.py), not through the API,
  # so none of the API's own auth/RLS applies here - that's expected, this
  # is the trusted admin path, not a second student-facing surface.
  streamlit:
    build: .
    restart: unless-stopped
    entrypoint: []
    # gatherUsageStats=false: Streamlit's telemetry posts to segment.io on
    # startup and on interactions, which buys the exam nothing. fileWatcherType
    # =none stops it rescanning the app tree on every rerun; nothing edits
    # source on the box. XSRF protection deliberately stays ON: the port is
    # published on loopback and reached through an SSM tunnel, but that tunnel
    # makes localhost:8501 reachable from any page the admin's browser has
    # open, and this dashboard can delete users and reset exam timers.
    command: ["streamlit", "run", "streamlit_app/app.py",
              "--server.address=0.0.0.0", "--server.port=8501",
              "--browser.gatherUsageStats=false",
              "--server.fileWatcherType=none"]
    # Overrides the Dockerfile's HEALTHCHECK, which probes port 8000 because the
    # image is built for the api service. Nothing listens on 8000 in this
    # container, so the inherited probe always failed and the container sat
    # permanently "unhealthy" while Streamlit was serving fine on 8501.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aitutor}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-aitutor_db}
    volumes:
      - ./prod/data:/app/prod/data:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8501:8501"
    mem_limit: 384m
    logging: *default-logging

volumes:
  postgres_data:
  chroma_data:
