# Active once certbot has issued a certificate for __DOMAIN_API__. Copied
# to nginx/conf.d/app.conf by scripts/ec2-bootstrap.sh, which substitutes
# __DOMAIN_API__ with the real domain (terraform's var.domain_api).
server {
    listen 80;
    server_name __DOMAIN_API__;

    # certbot's renewal challenge still needs to land here even once TLS
    # is up - it re-validates over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name __DOMAIN_API__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN_API__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN_API__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    limit_req zone=api burst=300 nodelay;

    location / {
        proxy_pass         http://api;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_cache        off;
    }

    location ~ ^/(hints|chat)/ {
        limit_req zone=llm burst=50 nodelay;
        proxy_pass         http://api;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_cache        off;
    }

    # Token-name-disclosure oracle (PRELAUNCH_CHECKLIST.md section 0): the
    # tightest zone, in addition to the general `api` zone above.
    location = /participants/login {
        limit_req zone=login burst=10 nodelay;
        proxy_pass         http://api;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://api/;
        access_log off;
    }
}
