worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Rate limiting: 20 req/s per IP, burst of 50 before queuing
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

    # Gzip for JSON API responses
    gzip            on;
    gzip_types      application/json text/plain;
    gzip_min_length 1000;

    client_max_body_size 2m;

    # Raised timeouts for LLM inference (can take 30-60s)
    proxy_read_timeout   120s;
    proxy_connect_timeout 10s;
    proxy_send_timeout   120s;

    upstream api {
        server api:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Apply rate limiting to all API calls
        limit_req zone=api burst=50 nodelay;

        location / {
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # SSE / streaming support (chat endpoint)
            proxy_buffering    off;
            proxy_cache        off;
        }

        # Health check (used by load balancer / monitoring)
        location /health {
            proxy_pass http://api/;
            access_log off;
        }

        # --- SSL placeholder ---
        # Enabled in Phase 3. To enable HTTPS:
        # 1. Obtain cert for air.da-tu.ca via certbot
        # 2. Uncomment and populate the ssl server block below
        # 3. Change listen 80 above to redirect to 443

        # server {
        #     listen 443 ssl;
        #     server_name air.da-tu.ca;
        #     ssl_certificate     /etc/letsencrypt/live/air.da-tu.ca/fullchain.pem;
        #     ssl_certificate_key /etc/letsencrypt/live/air.da-tu.ca/privkey.pem;
        #     ssl_protocols       TLSv1.2 TLSv1.3;
        #     ssl_ciphers         HIGH:!aNULL:!MD5;
        #     location / { proxy_pass http://api; ... }
        # }
    }
}
